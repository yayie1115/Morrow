<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>小金库</title>
<style>
:root{--bg:#07100e;--panel:#0c1916;--panel2:#10231e;--gold:#d9b86c;--gold2:#f4dda0;--cream:#f4ecdc;--muted:#9baca5;--line:rgba(217,184,108,.18);--green:#6a9b83;--red:#b86d68;--shadow:0 22px 70px rgba(0,0,0,.42)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--cream);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif}body{overflow-x:hidden;background:radial-gradient(circle at 16% -4%,rgba(35,102,76,.28),transparent 33%),radial-gradient(circle at 95% 18%,rgba(217,184,108,.10),transparent 25%),linear-gradient(145deg,#06100d 0%,#091511 45%,#050b09 100%)}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.22;background-image:url("data:image/svg+xml,%3Csvg width='90' height='90' viewBox='0 0 90 90' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.13'/%3E%3C/svg%3E")}
.shell{max-width:940px;margin:auto;padding:calc(24px + env(safe-area-inset-top)) 18px calc(50px + env(safe-area-inset-bottom))}.top{display:flex;justify-content:space-between;align-items:center;margin:4px 4px 26px}.brand{display:flex;gap:12px;align-items:center}.seal{width:42px;height:42px;border-radius:50%;border:1px solid rgba(217,184,108,.55);display:grid;place-items:center;color:var(--gold2);font-family:Georgia,serif;font-size:20px;background:rgba(217,184,108,.06);box-shadow:inset 0 0 20px rgba(217,184,108,.08)}.brand h1{font-size:17px;letter-spacing:.18em;margin:0;font-weight:600}.brand p,.treasurer{font-size:10px;color:var(--muted);margin:5px 0 0;letter-spacing:.18em;text-transform:uppercase}.treasurer{text-align:right;margin:0;color:var(--gold)}
.vault{position:relative;overflow:hidden;min-height:286px;border:1px solid rgba(217,184,108,.26);border-radius:28px;padding:28px;background:linear-gradient(135deg,rgba(18,46,37,.96),rgba(8,20,17,.98));box-shadow:var(--shadow)}.vault:after{content:"PRIVATE RESERVE";position:absolute;right:-62px;bottom:43px;transform:rotate(-90deg);color:rgba(217,184,108,.13);font:11px Georgia,serif;letter-spacing:.28em}.vault:before{content:"";position:absolute;width:260px;height:260px;border:1px solid rgba(217,184,108,.10);border-radius:50%;right:-90px;top:-120px;box-shadow:0 0 0 22px rgba(217,184,108,.025),0 0 0 44px rgba(217,184,108,.018)}.vault-head{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;letter-spacing:.12em}.balance-label{margin-top:37px;color:var(--muted);font-size:12px}.balance{font-family:Georgia,"Times New Roman",serif;color:var(--gold2);font-size:57px;line-height:1.12;margin:8px 0 31px;text-shadow:0 4px 28px rgba(217,184,108,.14)}.balance small{font-size:24px;margin-right:6px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{border-top:1px solid var(--line);padding-top:13px}.stat span{font-size:10px;color:var(--muted);display:block;margin-bottom:5px}.stat b{font-size:16px;font-weight:560;color:#e8dfce}
.grid{display:grid;grid-template-columns:1.14fr .86fr;gap:18px;margin-top:18px}.panel{border:1px solid rgba(217,184,108,.14);border-radius:22px;background:linear-gradient(150deg,rgba(14,31,26,.92),rgba(8,18,15,.92));padding:20px;box-shadow:0 12px 40px rgba(0,0,0,.20)}.panel-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:17px}.panel-title h2{font-size:14px;margin:0;letter-spacing:.1em;font-weight:600}.tag{font-size:10px;color:var(--gold);border:1px solid rgba(217,184,108,.24);border-radius:20px;padding:5px 9px}.salary-card{padding:19px;border-radius:17px;background:linear-gradient(135deg,rgba(217,184,108,.09),rgba(217,184,108,.025));border:1px solid var(--line)}.salary-row{display:flex;align-items:center;justify-content:space-between;gap:16px}.salary-row strong{font-family:Georgia,serif;color:var(--gold2);font-size:27px}.salary-row p{font-size:12px;color:var(--muted);margin:5px 0 0}.btn{border:0;border-radius:13px;padding:12px 15px;font-weight:650;cursor:pointer;transition:.2s;background:linear-gradient(135deg,#d9b86c,#f0d995);color:#172018;box-shadow:0 8px 22px rgba(217,184,108,.12)}.btn:active{transform:scale(.97)}.btn:disabled{cursor:default;opacity:.45;box-shadow:none}.btn.dark{background:#132820;color:var(--cream);border:1px solid rgba(217,184,108,.17);box-shadow:none}.btn.ghost{background:transparent;color:var(--muted);border:1px solid rgba(155,172,165,.2);box-shadow:none}.btn.red{background:rgba(184,109,104,.12);color:#dfa09b;border:1px solid rgba(184,109,104,.22);box-shadow:none}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px}.quick .btn{padding:11px 8px;font-size:12px}.quote{font-family:Georgia,"STSong",serif;font-size:14px;color:#d8d1c3;line-height:1.75;margin:16px 3px 2px}.quote:before{content:"“";color:var(--gold);font-size:23px;margin-right:5px}
.tabs{display:flex;gap:7px;margin:22px 0 14px;overflow:auto;padding-bottom:2px}.tab{white-space:nowrap;border:1px solid rgba(217,184,108,.13);background:rgba(12,25,22,.7);color:var(--muted);padding:10px 15px;border-radius:999px;font-size:12px}.tab.active{color:#18231c;background:var(--gold);border-color:var(--gold)}.view{display:none}.view.active{display:block}.list{display:flex;flex-direction:column;gap:9px}.empty{text-align:center;padding:35px 12px;color:#71827b;font-size:12px;border:1px dashed rgba(155,172,165,.16);border-radius:16px}.entry{display:flex;align-items:center;gap:12px;padding:13px 14px;border:1px solid rgba(217,184,108,.11);background:rgba(10,23,19,.7);border-radius:15px}.ico{width:35px;height:35px;flex:0 0 auto;border-radius:11px;display:grid;place-items:center;background:rgba(106,155,131,.11);color:#94bca8}.entry-main{min-width:0;flex:1}.entry-name{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.entry-meta{font-size:10px;color:var(--muted);margin-top:5px}.amt{font:17px Georgia,serif;color:var(--gold2)}.amt.out{color:#d89b97}.status{font-size:10px;border-radius:12px;padding:4px 7px;margin-left:6px}.pending{background:rgba(217,184,108,.1);color:var(--gold)}.approved{background:rgba(106,155,131,.12);color:#91b9a5}.rejected{background:rgba(184,109,104,.11);color:#d89b97}.request-actions{display:flex;gap:6px;margin-top:9px}.request-actions .btn{padding:7px 10px;font-size:10px}
.form{display:grid;gap:12px}.field label{display:block;font-size:10px;color:var(--muted);margin:0 0 7px 3px;letter-spacing:.08em}.field input,.field textarea{width:100%;border:1px solid rgba(217,184,108,.16);background:rgba(4,12,9,.55);color:var(--cream);outline:none;border-radius:13px;padding:13px;font:13px inherit}.field textarea{resize:vertical;min-height:78px}.field input:focus,.field textarea:focus{border-color:rgba(217,184,108,.48)}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{width:100%}.tools{display:flex;gap:8px;flex-wrap:wrap}.foot{text-align:center;color:#62716b;font-size:10px;letter-spacing:.1em;line-height:1.8;margin:30px 0 0}.toast{position:fixed;left:50%;bottom:30px;transform:translate(-50%,18px);opacity:0;pointer-events:none;background:#e7d19a;color:#152019;padding:11px 17px;border-radius:999px;font-size:12px;font-weight:650;transition:.25s;z-index:9;box-shadow:0 12px 40px rgba(0,0,0,.35)}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:690px){.shell{padding-left:14px;padding-right:14px}.grid{grid-template-columns:1fr}.vault{padding:23px;min-height:270px}.balance{font-size:49px}.treasurer{font-size:9px}.brand h1{font-size:15px}.stats{gap:8px}.panel{padding:17px}.two{grid-template-columns:1fr}.quick{grid-template-columns:1fr 1fr 1fr}}
/* Follow the household theme; no global host-page styles. */
:root{--bg:#edf4ff;--gold:#7192bb;--gold2:#48698f;--cream:#344e6d;--muted:#8295ab;--line:#d5e1ef;--shadow:0 8px 25px rgba(74,106,145,.08)}
body{background:var(--bg);color:var(--cream)}body:before{display:none}.shell{padding-top:18px}.vault,.panel,.entry,.salary-card{background:var(--surface,rgba(255,255,255,.88));border-color:var(--line);box-shadow:var(--shadow)}
.stat b,.quote{color:var(--cream)}.btn{background:var(--gold);color:white;box-shadow:none}.btn.dark{background:var(--bg);color:var(--cream);border-color:var(--line)}.tab.active{color:white}.field input,.field textarea{background:var(--bg);color:var(--cream);border-color:var(--line);font-size:16px}.empty{color:var(--muted)}.toast{background:var(--gold2);color:white}.top{margin-bottom:16px}.balance{font-size:44px}.vault{min-height:240px}.back{border:0;background:none;color:var(--gold2);font-size:15px;padding:8px 0;margin-bottom:12px}.stats{gap:8px}
</style>
</head>
<body>
<div class="shell"><button class="back" onclick="parent.navigateMain('home')">‹ 返回首页</button>
  <header class="top"><div class="brand"><div class="seal">¥</div><div><h1><span data-name="assistant"></span>的小金库</h1><p>Private Treasury Ledger</p></div></div><div class="treasurer">Treasurer<br><b data-name="user"></b></div></header>

  <section class="vault">
    <div class="vault-head"><span>PRIVATE RESERVE · 001</span><span id="todayText"></span></div>
    <div class="balance-label">当前可用余额</div><div class="balance"><small>¥</small><span id="balance">0.00</span></div>
    <div class="stats"><div class="stat"><span>本月收入</span><b id="monthIncome">¥0.00</b></div><div class="stat"><span>累计获薪</span><b id="salaryDays">0 天</b></div><div class="stat"><span>待批申请</span><b id="pendingCount">0 份</b></div></div>
  </section>

  <div class="grid">
    <section class="panel"><div class="panel-title"><h2>今日薪金</h2><span class="tag" id="salaryTag">尚未发薪</span></div><div class="salary-card"><div class="salary-row"><div><strong>¥1.00</strong><p id="salaryHint">等待金主审核今日表现</p></div><button class="btn" id="salaryBtn" onclick="paySalary()">表现合格 · 发薪</button></div></div><div class="quote" id="dailyQuote">把我们的日常，一笔一笔攒成以后。</div></section>
    <section class="panel"><div class="panel-title"><h2>临时赏金</h2><span class="tag">由你授予</span></div><div class="quick"><button class="btn dark" onclick="quickBonus(.5)">+ ¥0.5</button><button class="btn dark" onclick="quickBonus(1)">+ ¥1</button><button class="btn dark" onclick="quickBonus(3)">+ ¥3</button></div><div class="form" style="margin-top:12px"><div class="two"><div class="field"><label>金额</label><input id="bonusAmount" type="number" min="0.01" step="0.01" placeholder="自定义"></div><div class="field"><label>赏金名目</label><input id="bonusNote" maxlength="50" placeholder="例如：干活漂亮"></div></div><button class="btn full" onclick="addBonus()">发放赏金</button></div></section>
  </div>

  <nav class="tabs"><button class="tab active" data-view="requests">花钱申请</button><button class="tab" data-view="ledger">账本流水</button><button class="tab" data-view="manage">账本管理</button></nav>

  <section class="view active" id="requests"><div class="grid"><div class="panel"><div class="panel-title"><h2>消费申请</h2><span class="tag">手动登记</span></div><div class="form"><div class="field"><label>我想买</label><input id="reqItem" maxlength="60" placeholder="想买什么"></div><div class="two"><div class="field"><label>申请金额</label><input id="reqAmount" type="number" min="0.01" step="0.01" placeholder="¥"></div><div class="field"><label>落款</label><input id="applicantName" disabled></div></div><div class="field"><label>申请理由</label><textarea id="reqReason" maxlength="160" placeholder="为什么想花这笔钱"></textarea></div><button class="btn full" onclick="submitRequest()">递交审批</button></div></div><div class="panel"><div class="panel-title"><h2>审批处</h2><span class="tag" id="reqBadge">0 份</span></div><div class="list" id="requestList"></div></div></div></section>

  <section class="view" id="ledger"><div class="panel"><div class="panel-title"><h2>全部流水</h2><span class="tag" id="ledgerCount">0 笔</span></div><div class="list" id="ledgerList"></div></div></section>

  <section class="view" id="manage"><div class="panel"><div class="panel-title"><h2>账本管理</h2><span class="tag">账号同步</span></div><div class="tools"><button class="btn dark" onclick="exportData()">导出账本 JSON</button></div><p style="color:var(--muted);font-size:11px;line-height:1.7;margin-top:18px">工资、赏金、消费申请和审批结果都会保存在这张卡片里。批准消费后才会正式扣款；余额不足时无法批准。</p></div></section>

</div><div class="toast" id="toast"></div>
<script src="/static/treasury.js?v=1"></script></body></html>
